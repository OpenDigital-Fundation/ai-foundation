version: 1
entries:
- path: domains/security/skills/agent-security/references/mcp-config-review.md
  rule: unpinned package execution (@latest)
  reason: The review guide quotes @latest as the dangerous pattern it teaches agents
    to flag.
- path: domains/security/skills/security-audit/references/github-actions/references/runner-infrastructure.md
  rule: absolute machine path
  reason: The runner-persistence example quotes the GitHub-hosted runner workspace path that the attack targets.
- path: domains/documents/skills/technical-writing/references/documentation-quality/README.md
  rule: absolute machine path
  reason: The localisation guide tabulates per-OS install paths (placeholders such as <user>) as the convention to document.
- path: domains/platform/skills/deployment/references/containers/README.md
  rule: absolute machine path
  reason: The devcontainer example mounts the container user's home directory, a path inside the image, not this machine.
- path: domains/security/skills/secrets-hygiene/references/scanning-recipes.md
  rule: possible secret
  reason: The pattern table quotes AWS's documented example key and truncated prefixes as what the scanner must match.
- path: domains/security/skills/secrets-hygiene/references/scanning-recipes.md
  rule: private key
  reason: The pattern table quotes the PEM header line the scanner detects; there is no key material.
- path: domains/science/skills/bioinformatics/references/nextflow/references/configuration.md
  rule: absolute machine path
  reason: The AWS Batch example shows the CLI path inside the EC2 image the executor runs on, not a path on this machine.
- path: domains/science/skills/lab-automation/references/lab-hardware-cad/references/fabrication-limits.md
  rule: absolute machine path
  reason: The match is inside a supplier URL (/home/life-science/...), not a filesystem path.
