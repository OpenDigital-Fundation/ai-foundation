  type: skill
  capability: Agree seams, then red-green-refactor one vertical slice at a time with honest, behaviour-level tests.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "obra/superpowers:skill:test-driven-development"
  - "mattpocock/skills:skill:tdd"
  - "affaan-m/ECC:skill:tdd-workflow"
  - "affaan-m/ECC:agent:tdd-guide"
- id: testing/verification-before-completion
  type: skill
  capability: Run verification fresh and read the output before claiming work is complete, fixed or passing.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "obra/superpowers:skill:verification-before-completion"
  - "affaan-m/ECC:skill:verification-loop"
  - "msitarzewski/agency-agents:agent:Reality Checker"
  - "msitarzewski/agency-agents:agent:Evidence Collector"
- id: workflow/brainstorming
  type: skill
  capability: Find out what the user wants and why, compare approaches, and get a written spec approved before building.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "obra/superpowers:skill:brainstorming"
  - "mattpocock/skills:skill:to-spec"
  - "mattpocock/skills:skill:prototype"
  - "msitarzewski/agency-agents:agent:Rapid Prototyper"
  - "affaan-m/ECC:command:plan-prd"
  - "affaan-m/ECC:command:prp-prd"
  - "affaan-m/ECC:skill:intent-driven-development"
