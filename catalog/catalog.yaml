version: 1
artifacts:
- id: agent-engineering/parallel-agents
  type: skill
  capability: Dispatch one focused subagent per independent task and integrate their verified results.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "obra/superpowers:skill:dispatching-parallel-agents"
- id: agent-engineering/session-retrospective
  type: skill
  capability: Review a coding-agent session and propose ranked improvements to the agent's environment.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "mattpocock/skills:skill:retro"
- id: agent-engineering/writing-skills
  type: skill
  capability: "Author or edit a skill test-first: watch an agent fail without it, write it, and close loopholes."
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "obra/superpowers:skill:writing-skills"
- id: architecture/api-design
  type: skill
  capability: "Design or review HTTP APIs: resources, status codes, errors, pagination, auth, rate limits, versioning."
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "affaan-m/ECC:skill:api-design"
- id: architecture/architecture-review
  type: skill
  capability: Scan an existing codebase for deepening opportunities and walk the chosen one with the user.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "mattpocock/skills:skill:improve-codebase-architecture"
- id: architecture/codebase-design
  type: skill
  capability: Design deep modules at clean seams, including ports and adapters, with a shared vocabulary.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "mattpocock/skills:skill:codebase-design"
  - "affaan-m/ECC:skill:hexagonal-architecture"
- id: architecture/decision-records
  type: skill
  capability: Record, supersede, index and read architecture decision records, one decision per file.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "affaan-m/ECC:skill:architecture-decision-records"
- id: architecture/domain-modeling
  type: skill
  capability: Sharpen the domain language with scenarios, keep GLOSSARY.md current, and flag decisions worth an ADR.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "mattpocock/skills:skill:domain-modeling"
- id: code-quality/code-review
  type: skill
  capability: Pin a change, gather spec and standards, dispatch a fresh reviewer and act on numbered findings.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "obra/superpowers:skill:requesting-code-review"
  - "mattpocock/skills:skill:code-review"
  - "DietrichGebert/ponytail:skill:ponytail-review"
  - "affaan-m/ECC:command:code-review"
  - "affaan-m/ECC:command:review-pr"
- id: code-quality/code-reviewer
  type: agent
  capability: Read-only, fresh-context reviewer that reports evidence-backed findings by severity with a verdict.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "affaan-m/ECC:agent:code-reviewer"
  - "msitarzewski/agency-agents:agent:Code Reviewer"
- id: code-quality/codebase-audit
  type: skill
  capability: Audit a whole repository for bugs, risk, scale, missing tests, slowness and bloat in a ranked report.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "DietrichGebert/ponytail:skill:ponytail-audit"
- id: code-quality/debt-ledger
  type: skill
  capability: Collect every recorded shortcut comment into one ranked technical-debt ledger.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "DietrichGebert/ponytail:skill:ponytail-debt"
- id: code-quality/receiving-code-review
  type: skill
  capability: Verify review findings before acting, push back with evidence, and fix in severity order.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "obra/superpowers:skill:receiving-code-review"
- id: debugging/systematic-debugging
  type: skill
  capability: Build a tight feedback loop on the exact symptom, find the root cause from evidence, then fix with a regression
    test.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "obra/superpowers:skill:systematic-debugging"
  - "mattpocock/skills:skill:diagnosing-bugs"
- id: principles/coding-discipline
  type: skill
  capability: Make the smallest complete change, surface assumptions, keep diffs surgical and define a verifiable check.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - "DietrichGebert/ponytail:skill:ponytail"
  - "multica-ai/andrej-karpathy-skills:skill:karpathy-guidelines"
  - "msitarzewski/agency-agents:agent:Minimal Change Engineer"
