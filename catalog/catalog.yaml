  supersedes:
  - "obra/superpowers:skill:executing-plans"
  - "obra/superpowers:skill:subagent-driven-development"
  - "mattpocock/skills:skill:implement"
  - "mattpocock/skills:skill:implement-spec"
  - "affaan-m/ECC:command:prp-implement"
- id: workflow/feature-delivery
  type: workflow
  capability: Orchestrate the stages from idea to merge-ready branch with an approval gate between each stage.
