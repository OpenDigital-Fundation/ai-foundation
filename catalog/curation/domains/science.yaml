  recipe:
    title: Lab automation
    description: 'Use when automating laboratory work: writing or reviewing liquid-handling protocols for Opentrons or PyLabRobot,
      simulating runs before hardware, exporting and validating protocols from protocols.io, or designing parametric lab hardware
      for fabrication.'
    body: 'Turn a bench procedure into an automated protocol that is safe to run.


      ## Procedure


      1. **Write down the manual protocol** first: labware, volumes, reagents, order, incubation and mixing steps, and acceptance
      criteria.

      2. **Map to hardware:** deck layout, labware definitions, pipettes and tip usage; check volume ranges and tip counts
      before writing code.

      3. **Simulate** every protocol before a hardware run and review the simulated steps and tip usage.

      4. **First run dry,** then with water, then with real reagents; a person supervises the first real run.

      5. **Version the protocol** and record the robot software version and calibration state with each run.

      6. **Physical hardware:** export designs with tolerances and material notes; never claim fitness for safety-critical
      use.


      ## Working rules


      - **Pick one guide.** Load only the reference for the tool the task uses (list below). If two tools fit, say why you
      chose one.

      - **Pin and record versions** of every library, model, database release and reference genome or dataset used; results
      depend on them.

      - **Never fabricate data, results, identifiers or citations.** If a database query, file or run is unavailable, say
      so and stop at that step.

      - **Run locally and boundedly.** Inspect inputs (shape, units, missing values, coordinate system, identifiers) before
      any transform; avoid jobs whose cost or duration you cannot estimate; ask before using paid services or cloud resources.

      - **Validate before reporting:** sanity checks, controls, known reference values, or a re-run on a subset.

      - **Report** the question, inputs (with versions and provenance), method and parameters, results with uncertainty, checks
      performed, and limitations. Keep scripts and seeds so the analysis can be reproduced.

