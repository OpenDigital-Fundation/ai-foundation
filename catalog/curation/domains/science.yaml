  recipe:
    title: Bioinformatics
    description: 'Use when analysing biological sequence or omics data: single-cell or bulk RNA-seq, genomic intervals and
      variants, CRISPR screens, amplicon and microbiome reads, gene regulatory networks, pathway enrichment, primer design,
      metabolic or kinetic models, workflow pipelines (Nextflow) or querying public biological databases.'
    body: 'Turn raw or processed biological data into a defensible result.


      ## Procedure


      1. **Frame the question** as a comparison or estimate (e.g. "genes differentially expressed between conditions, controlling
      for batch"). Name organism, assembly (GRCh38, GRCm39…), annotation release and sample design.

      2. **Inspect inputs:** file formats (FASTQ, BAM/CRAM, VCF, BED, h5ad, count matrices), coordinate convention (0- or
      1-based, half-open), identifiers (Ensembl, symbols, UniProt), and sample metadata. Convert coordinates and identifiers
      explicitly.

      3. **Quality control** before analysis: read and cell QC, doublets, mitochondrial fraction, library size, batch structure.
      Record thresholds.

      4. **Analyse** with the standard tool for the data type (guides below), keeping defaults unless there is a reason to
      change them, and recording every non-default parameter.

      5. **Correct for multiplicity and batch** where relevant (FDR, design formulas, integration methods) and keep raw counts
      for statistics.

      6. **Interpret** with enrichment or databases only after the primary result is fixed; state the background set and the
      database release.


      ## Working rules


      - **Pick one guide.** Load only the reference for the tool the task uses (list below). If two tools fit, say why you
      chose one.

      - **Pin and record versions** of every library, model, database release and reference genome or dataset used; results
      depend on them.

      - **Never fabricate data, results, identifiers or citations.** If a database query, file or run is unavailable, say
      so and stop at that step.

      - **Run locally and boundedly.** Inspect inputs (shape, units, missing values, coordinate system, identifiers) before
      any transform; avoid jobs whose cost or duration you cannot estimate; ask before using paid services or cloud resources.

      - **Validate before reporting:** sanity checks, controls, known reference values, or a re-run on a subset.

      - **Report** the question, inputs (with versions and provenance), method and parameters, results with uncertainty, checks
      performed, and limitations. Keep scripts and seeds so the analysis can be reproduced.

      '
