      SMILES or SDF, descriptors and fingerprints, similarity and substructure search, drug-likeness filters, property prediction,
      docking, molecular dynamics, mass spectra or NMR processing, protein language models, crystal structures or phase equilibria.'
    body: 'Compute on molecules and materials with traceable, chemically valid inputs.


      ## Procedure


      1. **Standardise structures first:** sanitise, neutralise or keep charges deliberately, handle tautomers and stereochemistry,
      strip salts; record the toolkit and version. Reject what cannot be parsed instead of guessing.

      2. **Choose representations** for the question (fingerprint type and radius, descriptors, 3D conformers, graphs) and
      keep them fixed across compared sets.

      3. **Split data honestly** for models: scaffold or time splits for prospective claims, not only random splits.

      4. **Simulate within known limits:** docking scores rank poses, they are not binding affinities; MD needs equilibration
      and convergence checks; force fields and functionals must suit the system.

      5. **Check against references:** known actives, crystal poses, literature values, or experimental spectra.


      ## Working rules


      - **Pick one guide.** Load only the reference for the tool the task uses (list below). If two tools fit, say why you
      chose one.

      - **Pin and record versions** of every library, model, database release and reference genome or dataset used; results
      depend on them.

      - **Never fabricate data, results, identifiers or citations.** If a database query, file or run is unavailable, say
      so and stop at that step.

      - **Run locally and boundedly.** Inspect inputs (shape, units, missing values, coordinate system, identifiers) before
      any transform; avoid jobs whose cost or duration you cannot estimate; ask before using paid services or cloud resources.

      - **Validate before reporting:** sanity checks, controls, known reference values, or a re-run on a subset.

      - **Report** the question, inputs (with versions and provenance), method and parameters, results with uncertainty, checks
      performed, and limitations. Keep scripts and seeds so the analysis can be reproduced.

      '
