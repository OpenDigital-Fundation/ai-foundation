  recipe:
    title: Scientific writing
    description: 'Use when writing or reviewing scientific work: manuscripts and reports in IMRaD or journal formats, peer-review
      reports, grant proposals, venue and journal templates, posters, research talks and publication-quality figures.'
    body: 'Communicate research accurately, in the venue''s format, with figures that do not mislead.


      ## Procedure


      1. **Fix the claim and audience:** one-sentence main finding, the evidence for it, the venue and its requirements (length,
      structure, reporting guideline such as CONSORT, PRISMA or ARRIVE).

      2. **Outline from evidence:** each result paragraph points to a figure, table or analysis that exists. Never invent
      data, statistics or references; mark missing evidence instead.

      3. **Write plainly:** define terms once, keep tense and units consistent, separate results from interpretation, state
      limitations.

      4. **Make figures honest:** appropriate chart type, labelled axes with units, error bars defined, colour-blind-safe
      palettes, no truncated axes that exaggerate effects.

      5. **Review before submission:** check claims against results, numbers against tables, references against sources (`research:literature-review`),
      and the venue checklist.

      6. **Peer review:** summarise the contribution, separate major from minor issues, tie each issue to evidence, and keep
      the tone constructive.


      ## Working rules


      - **Pick one guide.** Load only the reference for the tool the task uses (list below). If two tools fit, say why you
      chose one.

      - **Pin and record versions** of every library, model, database release and reference genome or dataset used; results
      depend on them.

