      statsmodels: K-Dense-AI/claude-scientific-skills:skills/statsmodels
      pymc: K-Dense-AI/claude-scientific-skills:skills/pymc
      scikit-survival: K-Dense-AI/claude-scientific-skills:skills/scikit-survival
