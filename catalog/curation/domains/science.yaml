  recipe:
    title: Experimental design
    description: 'Use when planning or analysing a study: forming hypotheses and rival explanations, choosing a design, randomisation
      and blinding, sample size and power, choosing and checking statistical tests or models (regression, mixed, Bayesian,
      survival), exploratory analysis, validating an analytical method, or critically appraising the evidence behind a scientific
      claim.'
    body: 'Design studies that can answer their question, and analyse them without fooling yourself.


      ## Procedure


      1. **Question and hypotheses:** primary question, primary outcome, the effect that would matter in practice, and rival
      explanations to rule out.

      2. **Design before data:** unit of analysis, controls, randomisation, blinding, confounders, and how missing data will
      be handled. Write the analysis plan before seeing outcomes.

      3. **Size the study** with a power analysis from a justified effect size; report the assumptions.

      4. **Explore without testing:** describe distributions, outliers and data quality; keep exploratory findings labelled
      as such.

      5. **Analyse as planned:** check model assumptions, use the pre-specified test or model, correct for multiple comparisons,
      and report effect sizes with intervals, not only p-values.

      6. **Appraise the evidence:** design limitations, bias, reproducibility, and what result would change the conclusion.


      ## Working rules


      - **Pick one guide.** Load only the reference for the tool the task uses (list below). If two tools fit, say why you
      chose one.

      - **Pin and record versions** of every library, model, database release and reference genome or dataset used; results
      depend on them.

      - **Never fabricate data, results, identifiers or citations.** If a database query, file or run is unavailable, say
      so and stop at that step.

      - **Run locally and boundedly.** Inspect inputs (shape, units, missing values, coordinate system, identifiers) before
      any transform; avoid jobs whose cost or duration you cannot estimate; ask before using paid services or cloud resources.

      - **Validate before reporting:** sanity checks, controls, known reference values, or a re-run on a subset.

      - **Report** the question, inputs (with versions and provenance), method and parameters, results with uncertainty, checks
      performed, and limitations. Keep scripts and seeds so the analysis can be reproduced.

      '
    reference_dirs:
