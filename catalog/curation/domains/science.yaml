    body: 'Compute results whose numbers can be trusted and reproduced.


      ## Procedure


      1. **State the model:** equations, assumptions, units, boundary and initial conditions, and the quantity of interest.

      2. **Carry units and uncertainty** through the calculation; convert at the edges, not in the middle.

      3. **Start small:** a reduced problem with a known analytic or published answer; compare before scaling up.

      4. **Check numerics:** convergence in step size or mesh, solver tolerances, conservation laws, stability; for stochastic
      methods, seeds and enough replications.

      5. **Scale deliberately:** profile first; move to chunked, parallel or GPU execution only for the measured bottleneck,
      and verify the accelerated result against the reference run.

      6. **Version data and code** together so a figure can be regenerated from a commit.


      ## Working rules


      - **Pick one guide.** Load only the reference for the tool the task uses (list below). If two tools fit, say why you
      chose one.

