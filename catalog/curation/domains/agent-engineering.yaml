- id: agent-engineering/agent-guardrails
  type: skill
  capability: 'Use when an agent should be prevented from destructive or risky actions: blocking dangerous git and shell commands
    (push, reset --hard, clean, rm -rf, --no-verify) with harness hooks, carefu'
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - affaan-m/ECC:skill:safety-guard
  - github/awesome-copilot:hook:guard-tool
  - github/awesome-copilot:hook:tool-guardian
  - github/awesome-copilot:rule:hooks.instructions
  - github/awesome-copilot:skill:verify-agent-action
  - mattpocock/skills:skill:git-guardrails-claude-code
  - wshobson/agents:skill:session-guard
  recipe:
    title: Agent guardrails
    description: 'Use when an agent should be prevented from destructive or risky actions: blocking dangerous git and shell
      commands (push, reset --hard, clean, rm -rf, --no-verify) with harness hooks, careful and frozen modes, and protecting
      configuration files. Hooks are opt-in and installed only with the user''s approval.'
    base_dir: mattpocock/skills:skills/misc/git-guardrails-claude-code
    references:
      action-verification.md:
      - github/awesome-copilot:skills/verify-agent-action/SKILL.md
      safety-modes.md:
      - s:safety-guard
      operation-policies/README.md:
      - github/awesome-copilot:hooks/tool-guardian/README.md
      hook-contracts/README.md:
      - github/awesome-copilot:hooks/tool-guardian/README.md
      - github/awesome-copilot:instructions/hooks.instructions.md
      derived-guides.md:
      - wshobson/agents:plugins/skill-forge-essentials/skills/session-guard/SKILL.md#context-anchoring-anti-compaction
    append: '## Limits of this guardrail


      The hook script is a best-effort tripwire, not a security boundary. For real protection add permission deny rules or
      run the agent in an OS sandbox.


      - **Default deny on uncertainty:** it blocks when it cannot parse the input, when a git subcommand is not a known built-in
      (aliases are not inspected), when `git -c`/`--config-env` sets anything but presentation keys, when `GIT_CONFIG_*` variables
      are present, when `git config` would write aliases, includes, hooks paths or helper commands, for `env -S`, for a shell
      reading commands from stdin, and for `xargs` feeding git or a shell. A crash of the checker also blocks.

      - **Blocked operations:** `git push`, `reset --hard`, `clean -f`, `branch -D`, `checkout .`, `restore .`, `--no-verify`,
      and `rm` with recursive force, including through `bash -c`, `eval`, `$(...)`, `find -exec` and wrappers such as `sudo`/`env`.

      - **Known limit:** a script file passed to a shell (`bash scripts/x.sh`) is not inspected.

      - It needs `python3`; without it every Bash call is blocked with an explanation.

      - Installing the hook changes the user''s harness settings: show the exact file and JSON first and install only after
      explicit approval.'
    reference_notes:
      operation-policies/README.md: upstream hook documentation kept for its policy and pattern catalogue; the hook scripts
        are not copied. Before running a similar hook, adapt the input parser to your host, redact what it logs and test bypass
        and fail-closed behaviour
      hook-contracts/README.md: upstream hook documentation kept for its policy and pattern catalogue; the hook scripts are
        not copied. Before running a similar hook, adapt the input parser to your host, redact what it logs and test bypass
        and fail-closed behaviour
      derived-guides.md: 'sections merged from other collections where this skill had no equivalent: Context Anchoring (anti-compaction)'
