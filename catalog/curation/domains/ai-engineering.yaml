- id: ai-engineering/prompt-engineering
  type: skill
  capability: 'Use when writing, testing or optimising prompts for an LLM feature: system prompts, few-shot examples, structured
    output, prompt evaluation sets, prompt caching for cost and latency, and dec'
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - affaan-m/ECC:skill:cost-aware-llm-pipeline
  - affaan-m/ECC:skill:prompt-caching-strategy
  - affaan-m/ECC:skill:prompt-optimizer
  - affaan-m/ECC:skill:regex-vs-llm-structured-text
  - getsentry/skills:skill:prompt-optimizer
  - github/awesome-copilot:agent:Prompt Builder
  - github/awesome-copilot:agent:Prompt Engineer
  - github/awesome-copilot:rule:ai-prompt-engineering-safety-best-practices.instructions
  - github/awesome-copilot:rule:prompt.instructions
  - msitarzewski/agency-agents:agent:Prompt Engineer
  recipe:
    title: Prompt engineering
    description: 'Use when writing, testing or optimising prompts for an LLM feature: system prompts, few-shot examples, structured
      output, prompt evaluation sets, prompt caching for cost and latency, and deciding whether a regex or parser beats an
      LLM for structured text.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-prompt-engineer.md
      prompt-caching.md:
      - s:prompt-caching-strategy
      regex-or-llm.md:
      - s:regex-vs-llm-structured-text
      prompt-design/README.md:
      - github/awesome-copilot:agents/prompt-builder.agent.md
      - github/awesome-copilot:agents/prompt-engineer.agent.md
      - github/awesome-copilot:instructions/ai-prompt-engineering-safety-best-practices.instructions.md
      - github/awesome-copilot:instructions/prompt.instructions.md
    reference_dirs:
      prompt-optimization: getsentry/skills:skills/prompt-optimizer
    body: '# Prompt engineering


      Treat prompts as code: specified, tested against cases, and changed one variable at a time.


      ## 1. Specify

      The task, inputs, the exact output format, and what good looks like. Collect 20 or more realistic test inputs, including
      edge cases and adversarial ones.


      ## 2. Draft

      Clear role and goal, the context the model needs, explicit constraints, a few varied examples when the format is subtle,
      and structured output (JSON schema or tool calls) when code consumes it. Put stable content first so it can be cached.


      ## 3. Evaluate

      Run the test set; grade with code checks where possible and a versioned rubric (LLM-as-judge) otherwise. Record pass
      rate, cost and latency.


      ## 4. Iterate

      Fix the failure categories one at a time; keep a changelog of prompt versions and their scores. Consider whether a parser,
      regex or smaller model solves part of the task more reliably.


      ## 5. Ship

      Pin the model version, cache the static prefix, monitor quality on production samples, and rerun the evaluation before
      any model or prompt change. For the Claude API specifics, use `ai-engineering:claude-api`.'
- id: ai-engineering/rag-pipelines
  type: skill
  capability: 'Use when building, debugging or reviewing retrieval-augmented generation or search: chunking, embeddings, hybrid
    and lexical search, reranking, query rewriting, iterative retrieval for agent'
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - affaan-m/ECC:agent:rag-pipeline-reviewer
  - affaan-m/ECC:skill:iterative-retrieval
  - github/awesome-copilot:rule:langchain-python.instructions
  - msitarzewski/agency-agents:agent:RAG Pipeline Engineer
  - msitarzewski/agency-agents:agent:Search Relevance Engineer
  recipe:
    title: RAG pipelines
    description: 'Use when building, debugging or reviewing retrieval-augmented generation or search: chunking, embeddings,
      hybrid and lexical search, reranking, query rewriting, iterative retrieval for agents, Elasticsearch/OpenSearch relevance
      tuning, and retrieval evaluation.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-rag-pipeline-engineer.md
      review.md:
      - a:rag-pipeline-reviewer
      iterative-retrieval.md:
      - s:iterative-retrieval
      search-relevance.md:
      - msitarzewski/agency-agents:engineering/engineering-search-relevance-engineer.md
      langchain/README.md:
      - github/awesome-copilot:instructions/langchain-python.instructions.md
    body: '# RAG pipelines


      Retrieval quality decides answer quality: measure retrieval before tuning the prompt.


      ## 1. Build an evaluation set

      Real questions with the documents or passages that answer them. Measure recall@k and precision of retrieval, then faithfulness
      and correctness of answers.


      ## 2. Ingest

      Parse documents faithfully (tables, headings), chunk by structure rather than fixed size, keep metadata (source, section,
      date, permissions), and deduplicate.


      ## 3. Retrieve

      Hybrid search (lexical plus embeddings) with metadata filters, then rerank. Rewrite or decompose the query when questions
      are multi-part; for agents, retrieve iteratively.


      ## 4. Generate

      Pass only the top passages with their sources; instruct the model to answer from them and cite, and to say when the
      context does not contain the answer.


      ## 5. Iterate and monitor

      Change one thing at a time against the evaluation set; log queries, retrieved chunks and feedback in production; enforce
      document permissions at retrieval time.'
