    body: '# Technical writing


      Write documentation that lets a reader succeed at a task without asking anyone.


      ## 1. Know the reader and the task

      Who reads it (new user, integrator, operator, maintainer) and what they are trying to do. Pick the type: tutorial (learn),
      how-to (do), reference (look up), explanation (understand).


      ## 2. Structure

      Lead with the outcome and prerequisites; one task per section; numbered steps with the exact commands and expected output;
      examples that run.


      ## 3. Write

      Short sentences, active voice, consistent terms (the project glossary wins), no marketing language. Every code sample
      is copied from something that was run.


      ## 4. Verify

      Follow the doc from a clean environment; fix every step that failed or needed knowledge it did not give.


      ## 5. Keep it current

      Update docs in the same change as the code they describe; find stale docs by searching for changed names; record breaking
      changes in the changelog.'
