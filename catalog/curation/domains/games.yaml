  recipe:
    title: Game engineering
    description: 'Use when implementing and profiling a game runtime: scenes, entity state, save systems, engine
      integration, game audio, networking or a packaged game build.'
    body: '# Game engineering


      ## Fix the target

      Identify engine and exact version, language, target hardware, build configuration, input devices and multiplayer
      topology. Read the target repository before selecting an API. Source examples are design references, not a
      claim that code compiles against every engine version.


      ## Implement a vertical slice

      1. Define scene/entity ownership, lifecycle, state transitions and save-data versioning. Keep gameplay rules
      testable outside rendering and editor state where practical.

      2. Choose the smallest composition model that fits the engine. Establish explicit initialization, subscriptions,
      cleanup and asset lifetime; avoid hidden cross-scene dependencies.

      3. For multiplayer, distinguish server authority, client presentation and prediction. Validate identity, authorization,
      rate, bounds and state transitions at the authoritative boundary.

      4. Set CPU, GPU, memory, storage, networking and audio budgets from measured target hardware. Profile a representative
      packaged build before changing architecture for presumed performance.

      5. For assets and large worlds, define import validation, streaming/LOD policy, collision and persistence
      requirements. Authorize destructive editor operations separately.

      6. Test scene reload, save/load migration, disconnect/rejoin, latency/loss, long sessions and resource cleanup.
      Record tools, versions, fixture, build and measurement.


      ## Handoff

      Deliver the change, reproduction scene, tests, profile comparison and known target limitations. General code
      review belongs to code-quality:code-review; use security:security-audit for security review. Engine-specific
      references below do not mandate a single engine, middleware product or programming style.'
