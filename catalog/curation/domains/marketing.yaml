  recipe:
    title: Paid media
    description: 'Use for paid acquisition: search (PPC) and paid social campaigns, programmatic and display buying, search-query
      mining, ad creative, conversion tracking and attribution, and auditing ad accounts.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:paid-media/paid-media-ppc-strategist.md
      paid-social.md:
      - msitarzewski/agency-agents:paid-media/paid-media-paid-social-strategist.md
      programmatic.md:
      - msitarzewski/agency-agents:paid-media/paid-media-programmatic-buyer.md
      search-queries.md:
      - msitarzewski/agency-agents:paid-media/paid-media-search-query-analyst.md
      audit.md:
      - msitarzewski/agency-agents:paid-media/paid-media-auditor.md
      creative.md:
      - msitarzewski/agency-agents:paid-media/paid-media-creative-strategist.md
      tracking.md:
      - msitarzewski/agency-agents:paid-media/paid-media-tracking-specialist.md
    body: '# Paid media


      Spend where the next dollar returns the most, and prove it with clean measurement.


      ## 1. Measurement first

      Confirm conversion tracking end to end (pixel or tag, server-side events where possible, deduplication, consent mode)
      and agree the attribution model before changing bids. Without trustworthy conversions, stop and fix tracking.


      ## 2. Structure

      Campaigns by goal and audience, ad groups by tight intent, budgets by expected return. Search: match types and negatives
      from real query reports. Social and display: audiences, exclusions, frequency caps.


      ## 3. Creative

      Several angles per audience, each tied to a specific pain or desire, with clear offers and CTAs. Rotate on fatigue signals.


      ## 4. Optimise weekly

      Mine search terms, add negatives, shift budget toward cost per acquisition and return targets, pause losers with enough
      data, and test one change at a time.


      ## 5. Audit and report

      Wasted spend, tracking gaps, structure problems and opportunities, ranked by money at stake. Report spend, conversions,
      CPA or ROAS against target and the next actions.'
