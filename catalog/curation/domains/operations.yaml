      - github/awesome-copilot:skills/impediment-prioritization/SKILL.md#scoring-rubric-1-10-scales
    body: '# Project management


      Deliver the agreed scope on time by making the plan, the risks and the next steps visible to everyone.


      ## 1. Define

      Goal, scope and out of scope, success criteria, stakeholders and the decision maker, constraints and deadline. Get the
      definition agreed in writing.


      ## 2. Plan

      Break the work into milestones and tasks with owners and estimates; find the dependencies and the critical path; put
      buffers where uncertainty is highest. In a software repository, prefer `workflow:issue-breakdown` for the tasks.


      ## 3. Manage risks

      Risk log with likelihood, impact, owner and mitigation; review it every week.


      ## 4. Run the cadence

      Short status updates (done, next, blocked, decisions needed), meeting notes with decisions and action items, and a tracker
      that reflects reality.


      ## 5. Close

      Confirm acceptance, hand over, and write a short retrospective: what worked, what to change.'
    reference_notes:
