      - msitarzewski/agency-agents:specialized/change-management-consultant.md
      derived-guides.md:
      - github/awesome-copilot:skills/brag-sheet/SKILL.md#performance-review-prep,entry-format
      - github/awesome-copilot:skills/mentoring-juniors/SKILL.md#teaching-techniques
    body: '# People operations


      Hire, onboard and grow people with clear, fair and repeatable processes.


      ## 1. Hiring

      Role scorecard (outcomes, competencies, level) before the job description; structured interview loop where each interviewer
      owns specific competencies with written rubrics; debrief on evidence, not impressions.


      ## 2. Onboarding

      A 30-60-90 day plan: accounts and equipment ready on day one, a buddy, the first meaningful task in week one, explicit
      expectations and check-ins.


      ## 3. Training

      Learning objectives, the format that fits (docs, workshop, pairing), practice, and a check that the skill transferred.


      ## 4. Change

      For organisational change: why, what changes for whom, timeline, communication plan by audience, and how feedback is
      collected and answered.


      Employment-law questions need a qualified professional in the relevant jurisdiction.'
    reference_notes:
      derived-guides.md: 'sections merged from other collections where this skill had no equivalent: Performance Review Prep;
        Entry Format; Teaching Techniques'
    append: 'Motivation and leadership theories (Maslow, Herzberg, McGregor, Vroom, Adams, self-determination, situational
      and transformational leadership, psychological safety) with evidence and caveats: [`references/motivation-and-leadership.md`](references/motivation-and-leadership.md).

      '
