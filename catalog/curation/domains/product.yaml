    body: '# Product management


      Decide what to build and why, write it down so a team can build it, and check afterwards that it worked.


      ## 1. Frame the outcome

      State the user problem, who has it, the evidence (research, tickets, data) and the business outcome it moves. Write
      the success metric and its current baseline. No baseline means the first task is measuring it.


      ## 2. Shape the bet

      Compare two or three options, including "do nothing". For each: expected impact, confidence and effort (RICE or ICE),
      risks and what would prove it wrong. Recommend one.


      ## 3. Write the PRD

      Problem, goals and non-goals, users and jobs to be done, requirements as user stories with acceptance criteria, success
      metrics, risks, open questions, launch plan. In a repository, the PRD is the spec: hand it to `workflow:brainstorming`
      or `workflow:writing-plans`.


      ## 4. Prioritise

      Rank the backlog by value over effort against the current outcome goal; cut or defer the rest explicitly. Re-rank when
      evidence changes, not when someone asks loudest.


      ## 5. Learn

      Run experiments with a hypothesis, metric, sample size and stop rule. Synthesise feedback into themes with counts and
      quotes. After launch, compare the metric to the baseline and write what you learned.


      Market, competitor and capability analyses are in the references.'
