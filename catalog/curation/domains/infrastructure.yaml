- id: infrastructure/homelab-operations
  type: skill
  capability: 'Use when planning or operating a home/small-lab self-hosted environment: device roles, services,
    storage, DNS, access, backups, recovery and staged network readiness.'
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - affaan-m/ECC:agent:homelab-architect
  - affaan-m/ECC:skill:homelab-network-readiness
