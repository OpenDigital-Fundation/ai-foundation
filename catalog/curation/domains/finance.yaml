    body: '# Accounting


      Keep the books accurate, closed on time and ready for an accountant or auditor.


      ## 1. Record

      Every transaction categorised to the chart of accounts with its document (invoice, receipt, contract). Separate business
      and personal; never guess a category, flag it.


      ## 2. Reconcile

      Bank, cards, payment processors and payables against the ledger, monthly at least. Investigate every difference; do
      not plug it.


      ## 3. Close the month

      Accruals and prepayments, depreciation, revenue recognition, payroll entries, intercompany if any; review against the
      prior month and budget; lock the period.


      ## 4. Report

      Profit and loss, balance sheet and cash flow, with variance explanations for anything material.


      ## 5. Prepare for tax

      Organise records and open questions for the accountant. Tax positions and filings need a qualified professional; say
      so.'
