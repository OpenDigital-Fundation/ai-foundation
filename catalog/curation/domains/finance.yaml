      - wshobson/agents:plugins/startup-business-analyst/skills/startup-metrics-framework/SKILL.md#metric-tracking-best-practices,consumer-mobile-metrics
    body: '# Financial analysis


      Turn numbers into a decision, with assumptions anyone can audit.


      ## 1. Frame the question

      The decision the analysis informs, the horizon, and the output (model, forecast, memo).


      ## 2. Gather and check inputs

      Actuals from the source of truth, with dates; flag gaps and one-offs. Keep inputs separate from calculations.


      ## 3. Build the model

      Assumptions on one sheet, clearly labelled; drivers (volume, price, conversion, churn, headcount) flowing into the statements
      or unit economics; no hard-coded numbers inside formulas. Check that statements balance.


      ## 4. Stress it

      Base, downside and upside scenarios; sensitivity on the two or three drivers that matter most; break-even and runway.


      ## 5. Communicate

      Lead with the answer and the recommendation, then the drivers, risks and what would change the conclusion. For spreadsheet
      files use `documents:office-documents`. This is analysis, not investment or tax advice.'
