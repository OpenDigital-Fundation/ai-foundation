- id: creative-media/image-prompting
  type: skill
  capability: 'Use when writing prompts for image-generation models: photographic direction (lens, light, composition), style
    control, and representation that avoids stereotyped or culturally inaccurate de'
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - github/awesome-copilot:skill:image-annotations
  - msitarzewski/agency-agents:agent:Image Prompt Engineer
  - msitarzewski/agency-agents:agent:Inclusive Visuals Specialist
  recipe:
    title: Image prompting
    description: 'Use when writing prompts for image-generation models: photographic direction (lens, light, composition),
      style control, and representation that avoids stereotyped or culturally inaccurate depictions of people.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:design/design-image-prompt-engineer.md
      inclusive-visuals.md:
      - msitarzewski/agency-agents:design/design-inclusive-visuals-specialist.md
      derived-guides.md:
      - github/awesome-copilot:skills/image-annotations/SKILL.md#animated-gif-annotations,image-diffing
    body: '# Image prompting


      Describe the image a photographer or illustrator would need to make it, and check the result for accuracy and bias.


      ## 1. Brief

      Purpose and placement (hero, social, product), aspect ratio and resolution, brand constraints, and what must not appear.


      ## 2. Compose the prompt

      Subject and action; setting and time; composition and camera (shot size, angle, lens, depth of field); light (quality,
      direction, colour temperature); style and medium; mood. Concrete nouns beat adjectives.


      ## 3. Represent people accurately

      Specify people only as the brief requires; avoid defaulting to stereotypes of gender, age, ethnicity, disability or
      culture; get cultural dress, settings and symbols right. See the inclusive-visuals reference.


      ## 4. Iterate

      Change one attribute per round, keep the seed when comparing, and record the prompt that worked.


      ## 5. Review

      Check hands, text, logos and anatomy; confirm usage rights for the model and any reference images; never depict real,
      identifiable people without consent.'
    reference_notes:
      derived-guides.md: 'sections merged from other collections where this skill had no equivalent: Animated GIF Annotations;
        Image Diffing'
