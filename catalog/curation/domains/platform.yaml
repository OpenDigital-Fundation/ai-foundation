  - wshobson/agents:skill:slo-implementation
  recipe:
    title: Reliability and observability
    description: Use when defining SLOs and error budgets, adding logs, metrics and traces, building operator dashboards (Grafana,
      SigNoz), planning capacity, running chaos experiments, or maintaining infrastructure health.
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-sre.md
      dashboards.md:
      - s:dashboard-builder
      infrastructure-maintenance.md:
      - msitarzewski/agency-agents:support/support-infrastructure-maintainer.md
      operational-checklists/README.md:
      - github/awesome-copilot:agents/platform-sre-kubernetes.agent.md
      - github/awesome-copilot:instructions/devops-core-principles.instructions.md
      derived-guides.md:
      - davila7/claude-code-templates:cli-tool/components/skills/productivity/performance-optimizer/SKILL.md#common-optimizations
      - davila7/claude-code-templates:cli-tool/components/skills/development/core-web-vitals/SKILL.md#inp-interaction-to-next-paint,cls-cumulative-layout-shift
      - davila7/claude-code-templates:cli-tool/components/agents/web-tools/react-performance-optimizer.md#advanced-react-performance-patterns
      - Jeffallan/claude-skills:skills/monitoring-expert/SKILL.md#quick-start-examples
    body: '# Reliability and observability


      Make reliability measurable, then spend effort where the measurement says.


      ## 1. Define SLOs

      For each user-facing journey: the SLI (successful, fast-enough requests over valid requests), the target and window,
      and the error budget. Start from what users notice, not what is easy to measure.


      ## 2. Instrument

      Structured logs with request IDs, RED metrics (rate, errors, duration) per service, traces across service boundaries,
      and saturation for the resources that run out first.


      ## 3. Alert on symptoms

      Multi-window burn-rate alerts on the SLOs, routed to an owner, each with a runbook. Remove alerts nobody acts on.


      ## 4. Dashboards

      One page per service that answers "is it healthy, and if not, where": SLOs and budget, golden signals, recent deploys.
      See the dashboards reference.


      ## 5. Spend the budget

      Budget left: ship. Budget burnt: freeze risky changes and fix reliability. Reduce toil you repeat, plan capacity from
      data, and test failure modes deliberately (game days, chaos experiments) in safe environments.'
