      incident-runbook-templates: Create structured incident response runbooks with step-by-step procedures, escalation paths,
        and recovery actions. Use this skill when building a service outage runbook for a payment processing system
      on-call-handoff-patterns: Master on-call shift handoffs with context transfer, escalation procedures, and documentation.
        Use this skill when transitioning on-call responsibilities between engineers and ensuring the incoming re
      derived-guides.md: 'sections merged from other collections where this skill had no equivalent: Fast Decision Flow; Post-Incident
        Process; Immediate Actions (First 5 minutes); SRE Best Practices'
- id: platform/reliability
  type: skill
