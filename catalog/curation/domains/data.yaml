  type: skill
  capability: 'Use when building or fixing data pipelines and bulk data movement: ingestion, ETL/ELT, backfills, exports,
    warehouse or lakehouse loading, streaming, data quality checks and throughput probl'
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - affaan-m/ECC:skill:data-throughput-accelerator
  - github/awesome-copilot:agent:PySpark Expert Agent
  - github/awesome-copilot:rule:scala-spark.instructions
  - msitarzewski/agency-agents:agent:Data Engineer
  - wshobson/agents:skill:airflow-dag-patterns
  - wshobson/agents:skill:data-quality-frameworks
  - wshobson/agents:skill:dbt-transformation-patterns
  recipe:
    title: Data pipelines
    description: 'Use when building or fixing data pipelines and bulk data movement: ingestion, ETL/ELT, backfills, exports,
      warehouse or lakehouse loading, streaming, data quality checks and throughput problems.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-data-engineer.md
      throughput.md:
      - s:data-throughput-accelerator
      spark/README.md:
      - github/awesome-copilot:agents/spark-performance.agent.md
      - github/awesome-copilot:instructions/scala-spark.instructions.md
    body: '# Data pipelines


      Move data reliably: correct, complete, on time, and recoverable when something breaks.


      ## 1. Define the contract

      Sources, destination, schema, freshness target, volume, and who consumes the data. Write the data contract (fields,
      types, keys, nullability) before writing code.


      ## 2. Design the flow

      Batch or streaming; ELT into the warehouse or ETL before it; incremental loads keyed on a watermark or change data capture
      rather than full reloads. Every step idempotent so a rerun never duplicates.


      ## 3. Build in quality checks

      Row counts, uniqueness of keys, nulls, ranges and referential checks at each stage; quarantine bad records instead of
      failing silently.


      ## 4. Operate

      Orchestrate with retries and alerts, record lineage, and keep backfills as a first-class, rate-limited job. For slow
      or large movements, see the throughput reference.


      ## 5. Verify

      Compare source and destination totals for the run, check freshness against the target, and document how to replay a
      failed window.'
    reference_dirs:
      airflow-dag-patterns: wshobson/agents:plugins/data-engineering/skills/airflow-dag-patterns
      dbt-transformation-patterns: wshobson/agents:plugins/data-engineering/skills/dbt-transformation-patterns
      data-quality-frameworks: wshobson/agents:plugins/data-engineering/skills/data-quality-frameworks
    reference_notes:
      airflow-dag-patterns: Build production Apache Airflow DAGs with best practices for operators, sensors, testing, and
        deployment. Use when creating data pipelines, orchestrating workflows, or scheduling batch jobs.
      dbt-transformation-patterns: Master dbt (data build tool) for analytics engineering with model organization, testing,
        documentation, and incremental strategies. Use when building data transformations, creating data models, or imp
      data-quality-frameworks: Implement data quality validation with Great Expectations, dbt tests, and data contracts. Use
        when building data quality pipelines, implementing validation rules, or establishing data contracts.
