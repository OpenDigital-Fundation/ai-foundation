  recipe:
    title: Data pipelines
    description: 'Use when building or fixing data pipelines and bulk data movement: ingestion, ETL/ELT, backfills, exports,
      warehouse or lakehouse loading, streaming, data quality checks and throughput problems.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-data-engineer.md
      throughput.md:
      - s:data-throughput-accelerator
      spark/README.md:
      - github/awesome-copilot:agents/spark-performance.agent.md
      - github/awesome-copilot:instructions/scala-spark.instructions.md
    body: '# Data pipelines


      Move data reliably: correct, complete, on time, and recoverable when something breaks.


      ## 1. Define the contract

      Sources, destination, schema, freshness target, volume, and who consumes the data. Write the data contract (fields,
      types, keys, nullability) before writing code.


      ## 2. Design the flow

      Batch or streaming; ELT into the warehouse or ETL before it; incremental loads keyed on a watermark or change data capture
      rather than full reloads. Every step idempotent so a rerun never duplicates.


      ## 3. Build in quality checks

      Row counts, uniqueness of keys, nulls, ranges and referential checks at each stage; quarantine bad records instead of
      failing silently.


      ## 4. Operate

      Orchestrate with retries and alerts, record lineage, and keep backfills as a first-class, rate-limited job. For slow
      or large movements, see the throughput reference.


      ## 5. Verify

      Compare source and destination totals for the run, check freshness against the target, and document how to replay a
      failed window.'
