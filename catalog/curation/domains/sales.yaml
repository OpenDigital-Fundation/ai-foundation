      coaching.md:
      - msitarzewski/agency-agents:sales/sales-coach.md
      derived-guides.md:
      - davila7/claude-code-templates:cli-tool/components/agents/business-marketing/customer-success-manager.md#customer-success-reference-points
      - davila7/claude-code-templates:cli-tool/components/agents/business-marketing/sales-automator.md#compliance-anti-spam-requirements
      - github/awesome-copilot:skills/gtm-enterprise-onboarding/SKILL.md#common-mistakes
    body: '# Deal strategy


      Move a real opportunity forward with evidence about the buyer, not hope.


      ## 1. Qualify

      Use a framework the team shares (MEDDICC or similar): metrics, economic buyer, decision criteria and process, paper
      process, identified pain, champion, competition. Mark each as known, assumed or unknown.


      ## 2. Prepare each call

      Goal of the call, what you need to learn, hypotheses about the pain, questions in order, and the next step you will
      ask for. Research the account and attendees first.


      ## 3. Map the stakeholders

      Who decides, who influences, who blocks, and what each needs to say yes. Plan how to reach the economic buyer.


      ## 4. Advance

      Tailored demo or technical validation against their criteria; a proposal that restates their problem, the outcome, the
      plan and the price; objections answered with evidence.


      ## 5. Inspect the pipeline

      Each deal has a dated next step and a stage backed by evidence. Forecast by stage exit criteria; flag stalled deals
      and what would unblock them.'
    reference_notes:
      derived-guides.md: 'sections merged from other collections where this skill had no equivalent: Customer Success Reference
