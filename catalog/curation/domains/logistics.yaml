- id: logistics/supply-chain-planning
  type: skill
  capability: 'Use when planning physical supply chains: demand/capacity, inventory policy, suppliers, lead-time
    risk, sourcing alternatives and scenario-based total cost.'
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - msitarzewski/agency-agents:agent:Supply Chain Strategist
  recipe:
    title: Supply chain planning
    description: 'Use when planning physical supply chains: demand/capacity, inventory policy, suppliers, lead-time
      risk, sourcing alternatives and scenario-based total cost.'
    body: '# Supply-chain planning


      ## Bound the physical system

      Record products/SKUs, locations, units, demand history, lead-time distributions, service definition, capacity,
      shelf-life/safety constraints and applicable contracts. Do not confuse physical supply chains with software
      dependency security.


      ## Plan with explicit assumptions

      1. Reconcile demand, receipts, stock, backorders, costs and units over the same period. Quantify missingness
      and distinguish orders, shipments and consumption.

      2. Identify bottlenecks, supplier concentration, substitution constraints and correlated failure modes. Record
      qualification time/cost and capacity, not just supplier count.

      3. Choose a replenishment model that matches demand/lead-time behaviour and constraints. EOQ or a normal-demand
      safety-stock formula is conditional on its assumptions, not a universal recommendation.

      4. Compare scenarios using total landed/lifecycle cost, working capital, service and risk. Define time units
      and cost basis before computing; test sensitivity to seasonality, disruption and intermittent demand.

      5. Check proposals against MOQ, packaging multiples, capacity, cash, shelf life and recovery options. Supplier
      awards, hedges, purchases or contractual commitments need responsible approval.

      6. Backtest the policy and report service/cost tradeoffs, assumptions and an owner-controlled review cadence.


      ## Deliverable

      A reconciled baseline, assumptions/units register, scenarios, feasible policy, risk/contingency plan and measurable
      review criteria. Financial accounting belongs to finance; generic project execution to operations; dispatch
      and exceptions to logistics:logistics-operations.'
    references:
      supply-chain-strategist.md:
      - msitarzewski/agency-agents:specialized/supply-chain-strategist.md#inventory-management-strategies,tco-total-cost-of-ownership-analysis,supply-chain-risk-assessment,multi-source-procurement-strategy,workflow
    reference_notes:
      supply-chain-strategist.md: 'Reviewed adaptation: Supply Chain Strategist; version and approval assumptions
        are explicit.'
- id: logistics/logistics-operations
  type: skill
  capability: Use when organizing physical transport and carrier operations, shipment exceptions, delivery evidence,
    returns/reverse logistics, disposition or operational handoffs.
  status: experimental
  owner: '@OpenDigital-Fundation/ai-foundation'
  supersedes:
  - affaan-m/ECC:skill:carrier-relationship-management
  - affaan-m/ECC:skill:logistics-exception-management
  - affaan-m/ECC:skill:returns-reverse-logistics
  recipe:
    title: Logistics operations
    description: Use when organizing physical transport and carrier operations, shipment exceptions, delivery evidence,
      returns/reverse logistics, disposition or operational handoffs.
    body: '# Logistics operations


      ## Establish the shipment contract

      Capture shipment/order IDs, route, goods/handling class, promised windows/timezones, parties, carrier, documents,
      contractual responsibilities and decision owner. Verify current facts instead of using generic liability,
      claim-deadline or refund rules.


      ## Operate and resolve

      1. Track planned versus actual milestones with source and observation time. Separate carrier assertions, sensor
      evidence and confirmed receipt.

      2. For exceptions, classify delay, loss, damage, shortage, refusal, misdelivery or handling breach. Preserve
      evidence and escalate safety-sensitive cargo to qualified operators under the applicable process.

      3. Prioritize using actual safety, time, customer and financial impact. Set thresholds locally; example dollar
      limits, multipliers and generic claim windows are not policy.

      4. Compare recovery options, ownership, remaining shelf life/capacity and authorized costs. Do not promise
      replacement, refunds, carrier removal or liability before approval.

      5. Score carriers by defined service windows, denominator, sample size, claims and invoice accuracy; investigate
      evidence before attributing fraud or poor intent.

      6. For returns, record authorization, inspection, condition and custody; choose permitted restock, repair,
      vendor return, recycling or other disposition from product safety and local policy before economics.

      7. Communicate confirmed status, action owner and next update; close only with resolution evidence and reconciled
      inventory/credits.


      ## Handoff

      An exception/return log, evidence links, approved resolution, next owner, status and improvement actions.
      No automated contract, payment, shipment or disposal action is authorized by this skill alone.'
    references:
      carrier-relationship-management.md:
      - affaan-m/ECC:skills/carrier-relationship-management/SKILL.md#carrier-scorecarding,portfolio-strategy,carrier-selection-for-new-lanes,when-to-consolidate-vs-diversify,carrier-exit-criteria
      logistics-exception-management.md:
