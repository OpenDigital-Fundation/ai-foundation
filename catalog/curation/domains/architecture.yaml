  recipe:
    title: System design
    description: 'Use when designing a service, system or major feature end to end: components and boundaries, data flow,
      APIs and contracts, consistency and failure handling, scalability and latency budgets, caching, real-time collaboration
      and internationalisation concerns, and the trade-offs behind each choice.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-software-architect.md
      backend-architecture.md:
      - msitarzewski/agency-agents:engineering/engineering-backend-architect.md
