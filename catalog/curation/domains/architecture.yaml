      realtime-collaboration.md:
      - msitarzewski/agency-agents:engineering/engineering-realtime-collaboration-engineer.md
      internationalisation.md:
      - msitarzewski/agency-agents:engineering/engineering-i18n-engineer.md
      - s:i18n-sync
      design-checklists/README.md:
      - github/awesome-copilot:agents/hlbpa.agent.md
      - github/awesome-copilot:agents/project-architecture-planner.agent.md
    body: '# System design


      Choose a structure that meets the requirements with the least complexity, and record why.


      ## 1. Requirements

      Functional scope; non-functional targets with numbers (load, latency, availability, data size, consistency, compliance);
      constraints (team, budget, existing systems).


      ## 2. Shape

      Components and their responsibilities, data ownership and flows, synchronous versus asynchronous boundaries, and where
      state lives. Draw it. Prefer the simplest shape that meets the targets: a well-structured monolith beats premature services.


      ## 3. Interfaces

      APIs and events between components with their contracts (`architecture:api-design`), versioning, idempotency and error
      semantics.


      ## 4. Failure and scale

      What happens when each dependency is slow or down (timeouts, retries with backoff, circuit breakers, queues), how it
      scales (stateless tiers, partitioning, caching with invalidation), and the latency budget per hop.


      ## 5. Decide and record

      Compare two or three designs on the targets and trade-offs, pick one, and write the hard-to-reverse choices as ADRs
      (`architecture:decision-records`). Hand the design to `workflow:writing-plans`.'
    reference_dirs:
      saga-orchestration: wshobson/agents:plugins/backend-development/skills/saga-orchestration
      cqrs-implementation: wshobson/agents:plugins/backend-development/skills/cqrs-implementation
      event-store-design: wshobson/agents:plugins/backend-development/skills/event-store-design
      projection-patterns: wshobson/agents:plugins/backend-development/skills/projection-patterns
    reference_notes:
      saga-orchestration: Implement saga patterns for distributed transactions and cross-aggregate workflows. Use this skill
        when implementing distributed transactions across microservices where 2PC is unavailable, designing c
      cqrs-implementation: Implement Command Query Responsibility Segregation for scalable architectures. Use when separating
        read and write models, optimizing query performance, or building event-sourced systems.
      event-store-design: Design and implement event stores for event-sourced systems. Use when building event sourcing infrastructure,
        choosing event store technologies, or implementing event persistence patterns.
      projection-patterns: Build read models and projections from event streams. Use when implementing CQRS read sides, building
        materialized views, or optimizing query performance in event-sourced systems.
