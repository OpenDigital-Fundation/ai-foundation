  marketing/email-marketing:
    title: Email marketing
    description: 'Use when planning or writing marketing email: lifecycle and nurture sequences, newsletters, segmentation, deliverability, subject lines and A/B tests, and operating email tools.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:marketing/marketing-email-strategist.md
      operations.md:
      - s:email-ops
    body: '# Email marketing


      Send fewer, more relevant emails that people expect and act on.


      ## 1. Define the programme

      Goal per flow (activation, retention, conversion, win-back), audience segment, trigger or cadence, and the metric (clicks, conversions, revenue per send; opens are directional only).


      ## 2. Build the sequence

      For each email: one purpose, one call to action, subject line and preview text, timing relative to the trigger, and the exit condition (converted, unsubscribed, moved segment). Map branches for engaged versus silent recipients.


      ## 3. Write

      Lead with the reader''s benefit, keep it scannable, make the CTA a verb, and match the brand voice (`brand:brand-voice`). Write two subject-line variants for testing.


      ## 4. Protect deliverability

      Consent and easy unsubscribe, authenticated domain (SPF, DKIM, DMARC), list hygiene (suppress bounces and long-inactive contacts), and steady sending volume.


      ## 5. Test and report

      A/B test one variable at a time with enough volume to decide; report against the goal metric and roll the winner into the default.'
  marketing/paid-media:
    title: Paid media
    description: 'Use for paid acquisition: search (PPC) and paid social campaigns, programmatic and display buying, search-query mining, ad creative, conversion tracking and attribution, and auditing ad accounts.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:paid-media/paid-media-ppc-strategist.md
      paid-social.md:
      - msitarzewski/agency-agents:paid-media/paid-media-paid-social-strategist.md
      programmatic.md:
      - msitarzewski/agency-agents:paid-media/paid-media-programmatic-buyer.md
      search-queries.md:
      - msitarzewski/agency-agents:paid-media/paid-media-search-query-analyst.md
      audit.md:
      - msitarzewski/agency-agents:paid-media/paid-media-auditor.md
      creative.md:
      - msitarzewski/agency-agents:paid-media/paid-media-creative-strategist.md
      tracking.md:
      - msitarzewski/agency-agents:paid-media/paid-media-tracking-specialist.md
    body: '# Paid media


      Spend where the next dollar returns the most, and prove it with clean measurement.


      ## 1. Measurement first

      Confirm conversion tracking end to end (pixel or tag, server-side events where possible, deduplication, consent mode) and agree the attribution model before changing bids. Without trustworthy conversions, stop and fix tracking.


      ## 2. Structure

      Campaigns by goal and audience, ad groups by tight intent, budgets by expected return. Search: match types and negatives from real query reports. Social and display: audiences, exclusions, frequency caps.


      ## 3. Creative

      Several angles per audience, each tied to a specific pain or desire, with clear offers and CTAs. Rotate on fatigue signals.


      ## 4. Optimise weekly

      Mine search terms, add negatives, shift budget toward cost per acquisition and return targets, pause losers with enough data, and test one change at a time.


      ## 5. Audit and report

      Wasted spend, tracking gaps, structure problems and opportunities, ranked by money at stake. Report spend, conversions, CPA or ROAS against target and the next actions.'
