  agent-engineering/harness-design:
    title: Agent harness design
    description: 'Use when designing or auditing an AI agent or agentic product: its tools and action space, observation formatting, permissions, identity and trust, multi-agent topology, and the twelve-layer audit for wrapper regressions, memory pollution and silent repair loops.'
    base: s:agent-harness-construction
    references:
      architecture-audit.md:
      - s:agent-architecture-audit
      agentic-engineering.md:
      - s:agentic-engineering
      - s:ai-first-engineering
      multi-agent-systems.md:
      - msitarzewski/agency-agents:engineering/engineering-multi-agent-systems-architect.md
      - msitarzewski/agency-agents:specialized/agents-orchestrator.md
      identity-and-trust.md:
      - msitarzewski/agency-agents:specialized/agentic-identity-trust.md
      harness-tuning.md:
      - a:harness-optimizer
      enterprise-operations.md:
      - s:enterprise-agent-ops
  agent-engineering/agent-loops:
    title: Agent loops
    description: 'Use when designing, running or reviewing an autonomous or long-running agent loop: machine-checkable goals and stop conditions, quality gates and evals inside the loop, operator approval points, recovery, and failure modes such as spinning, gaming the verifier or finishing a wrong answer.'
    base: s:loop-design-check
    references:
      autonomous-loops.md:
