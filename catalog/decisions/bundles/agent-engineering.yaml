    - affaan-m/ECC:command:loop-status
  agent-engineering/agent-evaluation:
    title: Agent evaluation
    description: 'Use when measuring agents rather than a single skill: comparing coding agents or configurations head to head on custom tasks, building an eval harness with pass rate, cost and time, self-evaluation of finished work, and benchmark-driven optimisation loops.'
    base: s:agent-eval
    references:
      eval-harness.md:
      - s:eval-harness
      self-evaluation.md:
      - s:agent-self-evaluation
      evaluator.md:
      - a:agent-evaluator
      benchmark-loops.md:
