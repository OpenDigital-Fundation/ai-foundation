  agent-engineering/context-management:
    title: Context management
    description: 'Use when an agent session is long, expensive or near its context limit: budgeting tokens, deciding when and how to compact, what to keep in context versus files, and estimating the token cost of a task before running it.'
    base: s:context-budget
    references:
      compaction.md:
