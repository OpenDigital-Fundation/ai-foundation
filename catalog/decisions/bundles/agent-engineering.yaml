  agent-engineering/agent-debugging:
    title: Agent debugging
    description: 'Use when an agent run failed, looped, ignored instructions or produced a bad result and you need to know why: capture the transcript, diagnose the failure, contain and recover, and write an introspection report with fixes to prompts, tools or skills.'
    base: s:agent-introspection-debugging
    references:
      conversation-analysis.md:
      - a:conversation-analyzer
  agent-engineering/agent-guardrails:
    title: Agent guardrails
    description: 'Use when an agent should be prevented from destructive or risky actions: blocking dangerous git and shell commands (push, reset --hard, clean, rm -rf, --no-verify) with harness hooks, careful and frozen modes, and protecting configuration files. Hooks are opt-in and installed only with
      the user''s approval.'
    base_dir: mattpocock/skills:skills/misc/git-guardrails-claude-code
    references:
      safety-modes.md:
      - s:safety-guard
    append: '## Limits of this guardrail


      The hook script is a best-effort tripwire, not a security boundary. For real protection add permission deny rules or run the agent in an OS sandbox.


      - **Default deny on uncertainty:** it blocks when it cannot parse the input, when a git subcommand is not a known built-in (aliases are not inspected), when `git -c`/`--config-env` sets anything but presentation keys, when `GIT_CONFIG_*` variables are present, when `git config` would write aliases,
      includes, hooks paths or helper commands, for `env -S`, for a shell reading commands from stdin, and for `xargs` feeding git or a shell. A crash of the checker also blocks.

      - **Blocked operations:** `git push`, `reset --hard`, `clean -f`, `branch -D`, `checkout .`, `restore .`, `--no-verify`, and `rm` with recursive force, including through `bash -c`, `eval`, `$(...)`, `find -exec` and wrappers such as `sudo`/`env`.

      - **Known limit:** a script file passed to a shell (`bash scripts/x.sh`) is not inspected.

      - It needs `python3`; without it every Bash call is blocked with an explanation.

      - Installing the hook changes the user''s harness settings: show the exact file and JSON first and install only after explicit approval.'
  agent-engineering/agent-teams:
    title: Agent teams
    description: 'Use when coordinating several agents as a team on one effort: assigning owners and scope to work items, isolating each agent in its own branch or worktree, tracking state on a board, merge gates, and splitting a plan into frontend, backend and integration streams.'
    base: s:team-agent-orchestration
    references:
