  research/docs-lookup:
    title: Documentation lookup
    description: Use when the user asks how to use a library, framework, SDK or API, or before writing code against one whose current behaviour matters. Fetches up-to-date documentation (for example through a Context7 MCP server) instead of relying on training data, and searches for existing packages
      before writing new code.
    base: s:documentation-lookup
    references:
