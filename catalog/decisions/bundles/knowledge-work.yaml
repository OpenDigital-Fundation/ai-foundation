    description: 'Use when building with the Claude API or Anthropic SDKs: choosing a model, messages and streaming, tool use, MCP, agents, prompt caching, batch, token counting, error handling, or migrating between model versions. Read it before answering any pricing or limits question from memory.'
    base_dir: anthropics/skills:skills/claude-api
    line_budget_exception: Official upstream skill; its SKILL.md links to per-language references by relative path, so splitting it would break the links.
  ai-engineering/mcp-server-development:
    title: MCP server development
    description: 'Use when designing, building, testing or evaluating a Model Context Protocol server: choosing tools, resources and prompts, writing tool schemas and descriptions, transports, auth, error handling, the TypeScript or Python SDK, and evaluations that prove an agent can use the server.'
    base_dir: anthropics/skills:skills/mcp-builder
    references:
      typescript-sdk-patterns.md:
      - s:mcp-server-patterns
      server-design.md:
      - msitarzewski/agency-agents:specialized/specialized-mcp-builder.md
  ai-engineering/rag-pipelines:
    title: RAG pipelines
    description: 'Use when building, debugging or reviewing retrieval-augmented generation or search: chunking, embeddings, hybrid and lexical search, reranking, query rewriting, iterative retrieval for agents, Elasticsearch/OpenSearch relevance tuning, and retrieval evaluation.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-rag-pipeline-engineer.md
      review.md:
      - a:rag-pipeline-reviewer
      iterative-retrieval.md:
      - s:iterative-retrieval
      search-relevance.md:
      - msitarzewski/agency-agents:engineering/engineering-search-relevance-engineer.md
    body: '# RAG pipelines


      Retrieval quality decides answer quality: measure retrieval before tuning the prompt.


      ## 1. Build an evaluation set

      Real questions with the documents or passages that answer them. Measure recall@k and precision of retrieval, then faithfulness and correctness of answers.


      ## 2. Ingest

      Parse documents faithfully (tables, headings), chunk by structure rather than fixed size, keep metadata (source, section, date, permissions), and deduplicate.


      ## 3. Retrieve

      Hybrid search (lexical plus embeddings) with metadata filters, then rerank. Rewrite or decompose the query when questions are multi-part; for agents, retrieve iteratively.


      ## 4. Generate

      Pass only the top passages with their sources; instruct the model to answer from them and cite, and to say when the context does not contain the answer.


      ## 5. Iterate and monitor

      Change one thing at a time against the evaluation set; log queries, retrieved chunks and feedback in production; enforce document permissions at retrieval time.'
  ai-engineering/prompt-engineering:
    title: Prompt engineering
    description: 'Use when writing, testing or optimising prompts for an LLM feature: system prompts, few-shot examples, structured output, prompt evaluation sets, prompt caching for cost and latency, and deciding whether a regex or parser beats an LLM for structured text.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-prompt-engineer.md
      prompt-caching.md:
      - s:prompt-caching-strategy
      regex-or-llm.md:
      - s:regex-vs-llm-structured-text
    body: '# Prompt engineering


      Treat prompts as code: specified, tested against cases, and changed one variable at a time.


      ## 1. Specify

      The task, inputs, the exact output format, and what good looks like. Collect 20 or more realistic test inputs, including edge cases and adversarial ones.


      ## 2. Draft

      Clear role and goal, the context the model needs, explicit constraints, a few varied examples when the format is subtle, and structured output (JSON schema or tool calls) when code consumes it. Put stable content first so it can be cached.


      ## 3. Evaluate

      Run the test set; grade with code checks where possible and a versioned rubric (LLM-as-judge) otherwise. Record pass rate, cost and latency.


      ## 4. Iterate

      Fix the failure categories one at a time; keep a changelog of prompt versions and their scores. Consider whether a parser, regex or smaller model solves part of the task more reliably.


      ## 5. Ship

      Pin the model version, cache the static prefix, monitor quality on production samples, and rerun the evaluation before any model or prompt change. For the Claude API specifics, use `ai-engineering:claude-api`.'
  ai-engineering/ml-engineering:
    title: ML engineering
    description: 'Use when adding or operating machine learning in a product: data contracts, features, reproducible training, evaluation and model QA, serving, monitoring and drift, recommendation and ranking pipelines, and LLM post-training (SFT, preference optimisation).'
    base: s:mle-workflow
    references:
