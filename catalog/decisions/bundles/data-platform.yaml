name: data-platform
artifacts:
  data/database-design:
    title: Database design
    description: Use when designing a schema, writing or optimising queries, choosing indexes, transactions or isolation levels, or reviewing database code for PostgreSQL, MySQL/MariaDB, Redis, ClickHouse or an ORM such as Prisma. Covers data modelling, query plans, connection pooling, caching, replication
      and database security.
    base: s:postgres-patterns
    references:
      mysql.md:
      - s:mysql-patterns
      redis.md:
      - s:redis-patterns
      clickhouse.md:
      - s:clickhouse-io
      prisma.md:
      - s:prisma-patterns
      optimisation.md:
      - msitarzewski/agency-agents:engineering/engineering-database-optimizer.md
      reliability.md:
      - msitarzewski/agency-agents:engineering/engineering-database-reliability-engineer.md
      review.md:
      - a:database-reviewer
  data/database-migrations:
    title: Database migrations
    description: 'Use when changing a production database schema or data: writing migrations, renaming or dropping columns, backfills, adding indexes or constraints without downtime, and planning rollback. Applies expand-migrate-contract, forward-only changes and safety checks before running anything
      against shared data.'
    base: s:database-migrations
    supersedes:
    - affaan-m/ECC:command:database-migration
  data/data-pipelines:
    title: Data pipelines
    description: 'Use when building or fixing data pipelines and bulk data movement: ingestion, ETL/ELT, backfills, exports, warehouse or lakehouse loading, streaming, data quality checks and throughput problems.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-data-engineer.md
      throughput.md:
      - s:data-throughput-accelerator
    body: '# Data pipelines


      Move data reliably: correct, complete, on time, and recoverable when something breaks.


      ## 1. Define the contract

      Sources, destination, schema, freshness target, volume, and who consumes the data. Write the data contract (fields, types, keys, nullability) before writing code.


      ## 2. Design the flow

      Batch or streaming; ELT into the warehouse or ETL before it; incremental loads keyed on a watermark or change data capture rather than full reloads. Every step idempotent so a rerun never duplicates.


      ## 3. Build in quality checks

      Row counts, uniqueness of keys, nulls, ranges and referential checks at each stage; quarantine bad records instead of failing silently.


      ## 4. Operate

      Orchestrate with retries and alerts, record lineage, and keep backfills as a first-class, rate-limited job. For slow or large movements, see the throughput reference.


      ## 5. Verify

      Compare source and destination totals for the run, check freshness against the target, and document how to replay a failed window.'
  platform/git-workflow:
    title: Git workflow
    description: Use when choosing a branching strategy, writing commit messages, tidying history before a merge, resolving conflicts, rebasing versus merging, or setting up pre-commit hooks with formatting, type checks and tests.
    body: '# Git workflow


      Keep history readable and every change reviewable. The repository''s own conventions (`AGENTS.md`, `CONTRIBUTING.md`) always win; read them first.


      ## Branching


      - Work on a short-lived branch from the current main; never commit directly to the main branch unless the repository says so. For parallel or isolated work use `workflow:git-worktrees`.

      - Prefer trunk-based development with small pull requests; use release branches only when the product ships versions that need maintenance.


      ## Commits


      - One logical change per commit, with tests and code together. Write messages in the repository''s style; without one, use Conventional Commits (`feat(scope): imperative summary`, body explaining why).

      - Keep the author identity and signing the repository requires. Never bypass hooks or signing to make a commit pass.


      ## Before merging


      - Tidy local history (squash fixups, reorder) only on commits that were never shared. Rewriting shared history, force-pushing and deleting branches are destructive: present the exact refs and get explicit approval first.

      - Rebase onto main for a linear history when the team prefers it; merge when the branch is shared. Resolve conflicts by understanding both sides, then re-run the tests.


      ## Hooks


      Run formatting, type checks and fast tests before each commit with a pre-commit framework; keep the slow suite in CI. Setup steps are in the pre-commit reference.

      '
    references:
      branching-and-history.md:
      - s:git-workflow
      practices.md:
      - msitarzewski/agency-agents:engineering/engineering-git-workflow-master.md
      pre-commit.md:
      - mattpocock/skills:skills/misc/setup-pre-commit/SKILL.md
    supersedes:
    - affaan-m/ECC:skill:conventional-commit-review
  platform/github-operations:
    title: GitHub operations
    description: 'Use when operating a GitHub repository with the gh CLI: managing pull requests and issues, checking and re-running CI, configuring Actions, branch protection and releases, or monitoring Dependabot and security alerts.'
