  platform/reliability:
    title: Reliability and observability
    description: Use when defining SLOs and error budgets, adding logs, metrics and traces, building operator dashboards (Grafana, SigNoz), planning capacity, running chaos experiments, or maintaining infrastructure health.
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-sre.md
      dashboards.md:
      - s:dashboard-builder
      infrastructure-maintenance.md:
      - msitarzewski/agency-agents:support/support-infrastructure-maintainer.md
    body: '# Reliability and observability


      Make reliability measurable, then spend effort where the measurement says.


      ## 1. Define SLOs

      For each user-facing journey: the SLI (successful, fast-enough requests over valid requests), the target and window, and the error budget. Start from what users notice, not what is easy to measure.


      ## 2. Instrument

      Structured logs with request IDs, RED metrics (rate, errors, duration) per service, traces across service boundaries, and saturation for the resources that run out first.


      ## 3. Alert on symptoms

      Multi-window burn-rate alerts on the SLOs, routed to an owner, each with a runbook. Remove alerts nobody acts on.


      ## 4. Dashboards

      One page per service that answers "is it healthy, and if not, where": SLOs and budget, golden signals, recent deploys. See the dashboards reference.


      ## 5. Spend the budget

      Budget left: ship. Budget burnt: freeze risky changes and fix reliability. Reduce toil you repeat, plan capacity from data, and test failure modes deliberately (game days, chaos experiments) in safe environments.'
  platform/incident-response:
    title: Incident response
    description: 'Use when production is down or degraded, an alert fires, a breach is suspected, or a postmortem is due: assess severity, coordinate responders, communicate status, contain, recover, preserve evidence and write a blameless postmortem.'
    references:
      role-guide.md:
      - msitarzewski/agency-agents:engineering/engineering-incident-response-commander.md
      security-incidents.md:
      - msitarzewski/agency-agents:security/security-incident-responder.md
    body: '# Incident response


      Restore service first, communicate clearly throughout, and learn without blame afterwards.


      ## 1. Declare and assess

      Declare an incident as soon as users are affected. Assign severity from impact (who, how many, which function) and name an incident commander, a communicator and responders.


      ## 2. Stabilise

      Mitigate before diagnosing: roll back the last change, fail over, scale, or disable the feature flag. Every action in production follows the team''s change rules; destructive or irreversible steps need the commander''s explicit go.


      ## 3. Communicate

      Status updates at a fixed cadence to stakeholders and customers: what is affected, what is being done, next update time. No speculation about cause.


      ## 4. Resolve and verify

      Confirm recovery with the same signals that detected the incident; keep watching for a while before closing.


      ## 5. Postmortem

      Blameless timeline, impact, root cause and contributing factors, what went well, and action items with owners and dates. Suspected security incidents follow the security reference: preserve evidence, contain, and involve the security owner.'
