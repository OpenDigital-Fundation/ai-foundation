  python:
    also_supersedes: ["affaan-m/ECC:command:fastapi-review"]
    title: Python
    description: "Use when writing, testing, reviewing or building Python - scripts, packages, Django, Django REST Framework, Celery, FastAPI or PyTorch code. Loads idiomatic patterns and typing, pytest fixtures and mocking, Django and FastAPI security, a review checklist, packaging and verification loops (ruff, mypy, pip-audit, bandit)."
    topics:
      standards: ["r:python/coding-style.md", "r:python/patterns.md", "s:python-patterns"]
      testing: ["r:python/testing.md", "s:python-testing"]
      security: ["r:python/security.md"]
      review: ["a:python-reviewer"]
      tooling: ["r:python/hooks.md", "s:generating-python-installer"]
    frameworks:
      django: ["s:django-patterns", "s:django-tdd", "s:django-security", "s:django-verification", "s:django-celery", "a:django-reviewer", "a:django-build-resolver"]
      fastapi: ["r:python/fastapi.md", "s:fastapi-patterns", "a:fastapi-reviewer"]
      pytorch: ["s:pytorch-patterns", "a:pytorch-build-resolver"]
  go:
    title: Go
    description: "Use when writing, testing, reviewing or building Go code. Loads idiomatic Go (errors, interfaces, context, concurrency with goroutines and channels), table-driven tests, subtests, fuzzing and benchmarks, Go security pitfalls, a review checklist and fixes for go build, go vet and module errors."
    topics:
      standards: ["r:golang/coding-style.md", "r:golang/patterns.md", "s:golang-patterns"]
      testing: ["r:golang/testing.md", "s:golang-testing"]
      security: ["r:golang/security.md"]
      review: ["a:go-reviewer"]
      build: ["a:go-build-resolver"]
      tooling: ["r:golang/hooks.md"]
  rust:
    title: Rust
    description: "Use when writing, testing, reviewing, refactoring or building Rust code. Loads ownership and borrowing patterns, error handling with Result and thiserror/anyhow, async with Tokio, unit, integration, property and async tests, unsafe and dependency review, and fixes for borrow-checker and cargo build errors."
    topics:
      standards: ["r:rust/coding-style.md", "r:rust/patterns.md", "s:rust-patterns", "msitarzewski/agency-agents:engineering/engineering-rust-refactoring-specialist.md"]
      testing: ["r:rust/testing.md", "s:rust-testing"]
      security: ["r:rust/security.md"]
      review: ["a:rust-reviewer"]
      build: ["a:rust-build-resolver"]
      tooling: ["r:rust/hooks.md"]
