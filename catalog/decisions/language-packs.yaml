  ruby:
    title: Ruby
    description: "Use when writing, testing, reviewing or building Ruby, including Ruby on Rails applications. Loads Ruby style and idioms, Rails conventions (ActiveRecord, service objects, background jobs), RSpec and Minitest usage, Rails security pitfalls and a review checklist."
    topics:
