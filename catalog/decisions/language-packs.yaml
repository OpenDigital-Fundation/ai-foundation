    topics:
      standards: ["r:csharp/coding-style.md", "r:csharp/patterns.md", "s:dotnet-patterns", "r:fsharp/coding-style.md", "r:fsharp/patterns.md"]
      testing: ["r:csharp/testing.md", "s:csharp-testing", "r:fsharp/testing.md", "s:fsharp-testing"]
