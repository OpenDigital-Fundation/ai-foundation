# Curation decisions for the ui, ux and accessibility domains. See docs/adr/ui/split-ui-ux-accessibility-brand.md
artifacts:
  - id: ui/visual-design
    type: skill
    capability: "Design and build new pages that look designed, with themes, job-first layout and browser-linted quality gates."
    supersedes:
      - "Nutlope/hallmark:skill:hallmark"
      - "anthropics/skills:skill:frontend-design"
      - "affaan-m/ECC:skill:frontend-design-direction"
      - "msitarzewski/agency-agents:agent:UI Designer"
      - "msitarzewski/agency-agents:agent:UI Finish-Gate Reviewer"
      - "nextlevelbuilder/ui-ux-pro-max-skill:agent:design-review"
      - "nextlevelbuilder/ui-ux-pro-max-skill:command:design-review"
  - id: ui/design-system
    type: skill
    capability: "Choose or generate a design system (style, palette, type, charts, icons, tokens) from a curated database."
    supersedes:
      - "nextlevelbuilder/ui-ux-pro-max-skill:skill:ui-ux-pro-max"
      - "nextlevelbuilder/ui-ux-pro-max-skill:skill:design-system"
      - "nextlevelbuilder/ui-ux-pro-max-skill:command:design-plan"
      - "affaan-m/ECC:skill:design-system"
  - id: accessibility/wcag-accessibility
    type: skill
    capability: "Design, build and audit interfaces to WCAG 2.2 AA on web, iOS and Android."
    supersedes:
      - "affaan-m/ECC:skill:accessibility"
      - "affaan-m/ECC:skill:frontend-a11y"
      - "affaan-m/ECC:agent:a11y-architect"
      - "affaan-m/ECC:rule:react-native/accessibility"
      - "msitarzewski/agency-agents:agent:Accessibility Auditor"
  - id: ux/user-research
    type: skill
    capability: "Plan, run and synthesise user research that informs a concrete product decision."
    supersedes: ["msitarzewski/agency-agents:agent:UX Researcher"]
  - id: ux/usability-review
    type: skill
    capability: "Expert walkthrough and heuristic evaluation of an interface or flow, with ranked fixes."
    supersedes: ["msitarzewski/agency-agents:agent:Persona Walkthrough Specialist"]
exclusions:
  - {key: "msitarzewski/agency-agents:agent:Section 508 Accessibility Specialist", reason: vendor-specific, note: "US federal procurement; covered by WCAG 2.2 AA in accessibility:wcag-accessibility."}
