# Curation decisions for the architecture domain. See docs/specs/architecture/catalog/spec.md
artifacts:
  - id: architecture/domain-modeling
    type: skill
    capability: "Sharpen the domain language with scenarios, keep GLOSSARY.md current, and flag decisions worth an ADR."
    supersedes: ["mattpocock/skills:skill:domain-modeling"]
  - id: architecture/decision-records
    type: skill
    capability: "Record, supersede, index and read architecture decision records, one decision per file."
    supersedes: ["affaan-m/ECC:skill:architecture-decision-records"]
  - id: architecture/codebase-design
    type: skill
    capability: "Design deep modules at clean seams, including ports and adapters, with a shared vocabulary."
    supersedes: ["mattpocock/skills:skill:codebase-design", "affaan-m/ECC:skill:hexagonal-architecture"]
  - id: architecture/architecture-review
    type: skill
    capability: "Scan an existing codebase for deepening opportunities and walk the chosen one with the user."
    supersedes: ["mattpocock/skills:skill:improve-codebase-architecture"]
  - id: architecture/api-design
    type: skill
    capability: "Design or review HTTP APIs: resources, status codes, errors, pagination, auth, rate limits, versioning."
    supersedes: ["affaan-m/ECC:skill:api-design"]
