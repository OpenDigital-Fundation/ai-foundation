# Curation decisions for the security domain. See docs/specs/security/catalog/spec.md
artifacts:
  - id: security/security-audit
    type: skill
    capability: "Source-first security guidance or full audit with sandboxed validation and schema-checked findings."
    supersedes:
      - "SecurityStandards/skill-security-audit:skill:security-audit"
      - "affaan-m/ECC:skill:security-review"
      - "affaan-m/ECC:skill:security-bounty-hunter"
      - "affaan-m/ECC:agent:security-reviewer"
      - "affaan-m/ECC:rule:common/security"
      - "msitarzewski/agency-agents:agent:Application Security Engineer"
      - "msitarzewski/agency-agents:agent:AI-Generated Code Security Auditor"
      - "msitarzewski/agency-agents:agent:Penetration Tester"
  - id: security/threat-modeling
    type: skill
    capability: "Map data flows and trust boundaries, run STRIDE, rank threats, and turn them into mitigations and tests."
    supersedes: ["msitarzewski/agency-agents:agent:Security Architect"]
  - id: security/secrets-hygiene
    type: skill
    capability: "Respond to exposed secrets rotation-first and set up scanning, brokering and rotation."
    supersedes: ["msitarzewski/agency-agents:agent:Secrets & Credential Hygiene Engineer"]
  - id: security/agent-security
    type: skill
    capability: "Harden agents and harnesses against injection and over-permission; statically review MCP and hook configs."
    supersedes:
      - "affaan-m/ECC:skill:agent-security-hardening"
      - "affaan-m/ECC:skill:mcp-dependency-review"
      - "affaan-m/ECC:skill:security-scan"
      - "affaan-m/ECC:command:security-scan"
  - id: security/external-references
    type: knowledge
    capability: "Links and licence notes for security material referenced but not copied (Shannon, checklists, OWASP)."
exclusions:
  - {key: "affaan-m/ECC:skill:perl-security", reason: out-of-scope, note: "Perl is not a supported language pack in v1."}
  - {key: "affaan-m/ECC:skill:defi-amm-security", reason: out-of-scope}
  - {key: "affaan-m/ECC:skill:llm-trading-agent-security", reason: out-of-scope}
  - {key: "msitarzewski/agency-agents:agent:Blockchain Security Auditor", reason: out-of-scope}
