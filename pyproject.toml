[project]
name = "ai-foundation-tools"
version = "0.0.0"
description = "Validators, generators and eval runners for the OpenDigital AI Foundation catalog."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.23"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools"]
pythonpath = ["."]

# Keep maintenance tests under tools/build in the default CI collection.
norecursedirs = [".*", "__pycache__", "dist", "node_modules", "venv", "_darcs", "CVS", "*.egg"]
