name: dependency-smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Runtime versions
        run: |
          node --version
          uv --version
      - run: uv sync --frozen
      - name: Build and verify real adapter packages
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from tools.build.adapters import build_all
          from tools.build.artifact_smoke import pack
          temporary = Path(os.environ["RUNNER_TEMP"])
          adapters = temporary / "foundation-smoke-adapters"
          assert not adapters.exists()
          counts = build_all(Path.cwd(), adapters)
          print(pack(adapters, temporary / "foundation-smoke-packages", counts["skills"]))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-smoke-packages
          path: ${{ runner.temp }}/foundation-smoke-packages/*
          archive: true
          if-no-files-found: error
          retention-days: 1

  download:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-smoke-packages
          path: packages
      - name: Verify downloaded hashes, ZIP paths and skill counts
        run: python packages/verify_artifacts.py verify packages
