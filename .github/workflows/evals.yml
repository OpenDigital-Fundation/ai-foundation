name: evals

# Model-backed evals are billed: they run only on demand, never on every push.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: "domain/name to evaluate (empty = all with evals, plus routing)"
        required: false
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  triggers:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-evals'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.318
      - run: uv sync --frozen
      - name: Trigger and routing evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL: ${{ github.event.inputs.skill }}
        run: |
          if [ -n "$SKILL" ]; then
            if ! printf '%s' "$SKILL" | grep -Eq '^[a-z0-9-]+/[a-z0-9-]+$'; then
              echo "invalid skill id: expected <domain>/<name>" >&2
              exit 1
            fi
            uv run python -m tools.evals.triggers --skill "$SKILL"
          else
            uv run python -m tools.evals.triggers --routing
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: evals/results/
