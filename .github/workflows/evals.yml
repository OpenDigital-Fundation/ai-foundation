name: evals

# Model-backed evals are billed: they run only on demand, never on every push.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: "domain/name to evaluate (empty = all with evals, plus routing)"
        required: false
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  triggers:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-evals'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.318
      - run: uv sync --frozen
      - name: Trigger and routing evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL: ${{ github.event.inputs.skill }}
        run: |
          if [ -n "$SKILL" ]; then
            if ! printf '%s' "$SKILL" | grep -Eq '^[a-z0-9-]+/[a-z0-9-]+$'; then
              echo "invalid skill id: expected <domain>/<name>" >&2
              exit 1
            fi
            uv run python -m tools.evals.triggers --skill "$SKILL"
          else
            uv run python -m tools.evals.triggers --routing
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: evals/results/
