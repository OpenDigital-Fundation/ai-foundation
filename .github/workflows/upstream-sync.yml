name: upstream-sync

# Weekly report of what changed upstream since the pinned commits. It opens an issue for review and
# never changes repository content.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m tools.inventory.sync_report "$RUNNER_TEMP/sync" --out report.md
      - name: Open an issue when sources moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "Nothing to review" report.md; then
            gh issue create --title "Upstream sync $(date -u +%Y-%m-%d)" --body-file report.md --label upstream-sync || \
            gh issue create --title "Upstream sync $(date -u +%Y-%m-%d)" --body-file report.md
          fi
